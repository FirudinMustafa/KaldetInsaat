services:
  postgres:
    image: postgres:16
    container_name: kaldet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaldet_insaat
    ports:
      - "55432:5432"
    volumes:
      - kaldet_postgres_data:/var/lib/postgresql/data

volumes:
  kaldet_postgres_data:
